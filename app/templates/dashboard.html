{% extends "base.html" %}
{% block title %}Analytics — HAWK RADAR{% endblock %}

{% block content %}
<header class="page-head">
  <div>
    <h1>Analytics</h1>
    <p class="page-sub">Severity over time, recurring indicators and feed health</p>
  </div>
</header>
<div id="content"><div class="status-msg">Loading analytics</div></div>
{% endblock %}

{% block scripts %}
<script>
  const SEVERITIES = ['critical', 'high', 'medium', 'low', 'unknown'];
  const DAY_MS = 86400000;

  function shortDate(iso) {
    return new Date(`${iso}T00:00:00Z`).toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  function lastThirtyDays(byDay) {
    const known = new Map((byDay || []).map(day => [day.date, day]));
    const today = Date.now();
    return Array.from({ length: 30 }, (_, i) => {
      const date = new Date(today - (29 - i) * DAY_MS).toISOString().slice(0, 10);
      return known.get(date) || { date, total: 0 };
    });
  }

  function niceStep(value) {
    const magnitude = Math.pow(10, Math.floor(Math.log10(Math.max(value, 1))));
    const scaled = value / magnitude;
    const step = scaled <= 1 ? 1 : scaled <= 2 ? 2 : scaled <= 5 ? 5 : 10;
    return Math.max(step * magnitude, 1);
  }

  // One outlier day must not flatten the other 29, so very tall bars are cut and labeled.
  function chartScale(totals) {
    const sorted = [...totals].sort((a, b) => a - b);
    const max = sorted[sorted.length - 1];
    const second = sorted[sorted.length - 2];
    const target = second > 0 && max > 3 * second ? second * 1.25 : max;
    const step = niceStep(Math.max(target, 4) / 4);
    return { step, top: step * Math.ceil(Math.max(target, 1) / step) };
  }

  function renderTimeline(byDay) {
    const days = lastThirtyDays(byDay);
    if (!days.some(day => day.total > 0)) {
      return '<p class="empty">No data yet. Feeds populate on the next refresh.</p>';
    }

    const { step, top } = chartScale(days.map(day => day.total));
    let grid = '';
    for (let value = 0; value <= top; value += step) {
      grid += `<div class="grid-line" style="bottom:${(value / top) * 100}%"><span class="grid-label">${value}</span></div>`;
    }

    const columns = days.map((day, index) => {
      const capped = day.total > top;
      const height = Math.min(day.total / top, 1) * 100;
      const segments = SEVERITIES
        .filter(severity => day[severity] > 0)
        .map(severity => `<div class="seg sev-${severity}" style="height:${(day[severity] / day.total) * 100}%"></div>`)
        .join('');
      const rows = SEVERITIES
        .filter(severity => day[severity] > 0)
        .map(severity => `<div class="tip-row sev-${severity}"><span class="dot"></span>${capitalize(severity)}<b>${day[severity]}</b></div>`)
        .join('');
      const edge = index < 3 ? ' tip-start' : index > 26 ? ' tip-end' : '';
      return `
        <div class="day${edge}" tabindex="0" aria-label="${shortDate(day.date)}: ${day.total} items">
          ${day.total > 0 ? `<div class="bar" style="height:${height}%">${segments}${capped ? `<span class="bar-break"></span><span class="bar-cap">${day.total}</span>` : ''}</div>` : ''}
          <div class="tip"><div class="tip-date">${shortDate(day.date)}, ${day.total} items</div>${rows}</div>
        </div>
      `;
    }).join('');

    const labels = days.map((day, index) => {
      const fromEnd = 29 - index;
      return `<span>${fromEnd % 5 === 0 ? `<i${fromEnd % 10 === 0 ? ' class="major"' : ''}>${shortDate(day.date)}</i>` : ''}</span>`;
    }).join('');

    return `
      <div class="chart"><div>${grid}</div><div class="bars">${columns}</div></div>
      <div class="chart-x">${labels}</div>
    `;
  }

  function renderRank(rows, { mono = false, columns = false } = {}) {
    const max = Math.max(...rows.map(row => row.count), 1);
    const style = columns ? ` style="grid-template-rows:repeat(${Math.ceil(rows.length / 2)}, auto)"` : '';
    return `<ol class="rank${columns ? ' cols-2' : ''}"${style}>` + rows.map((row, index) => `
      <li>
        <span class="rank-n">${index + 1}</span>
        <span class="rank-name${mono ? ' mono' : ''}" title="${esc(row.name)}">${esc(row.name)}</span>
        <span class="rank-track"><span class="rank-fill" style="display:block;width:${Math.max((row.count / max) * 100, 2)}%"></span></span>
        <span class="rank-count">${esc(row.count)}</span>
      </li>
    `).join('') + '</ol>';
  }

  function renderFeedHealth(feeds) {
    return feeds.map(feed => {
      let status = 'off';
      let label = 'Disabled';
      if (feed.enabled) {
        if (feed.last_error) { status = 'err'; label = 'Error'; }
        else if (!feed.last_fetched) { status = 'warn'; label = 'Pending'; }
        else { status = 'ok'; label = 'Healthy'; }
      }
      return `
        <div class="health-row status-${status}">
          <span class="dot"></span>
          <div class="health-name">${esc(feed.name)}<span>${esc(feed.category)}</span></div>
          <div class="health-count">${esc(feed.item_count)}</div>
          <div class="health-status">${label}</div>
        </div>
        ${feed.last_error ? `<div class="health-error">${esc(feed.last_error)}</div>` : ''}
      `;
    }).join('');
  }

  async function loadDashboard() {
    const [analyticsResp, feedResp] = await Promise.all([
      fetch('/web/analytics', { headers: { 'X-CSRFToken': CSRF } }),
      fetch('/web/feed-status', { headers: { 'X-CSRFToken': CSRF } }),
    ]);
    const analytics = await analyticsResp.json();
    const feedData = await feedResp.json();
    const sev = analytics.severity_counts || {};
    const total = SEVERITIES.reduce((sum, severity) => sum + (sev[severity] || 0), 0);
    const activeFeeds = (analytics.feed_stats || []).filter(feed => feed.enabled).length;

    let html = `
      <section class="stats" aria-label="Summary">
        <div class="stat"><div class="stat-lbl">Total items</div><div class="stat-val">${esc(analytics.total)}</div></div>
        <div class="stat"><div class="stat-lbl">Last 24 hours</div><div class="stat-val">${esc(analytics.last_24h)}</div></div>
        <div class="stat"><div class="stat-lbl">Critical</div><div class="stat-val is-critical">${esc(analytics.critical_count)}</div></div>
        <div class="stat"><div class="stat-lbl">Active feeds</div><div class="stat-val">${activeFeeds}</div></div>
      </section>
    `;

    const legend = SEVERITIES.map(severity => `<span class="sev-${severity}"><i class="dot"></i>${capitalize(severity)}</span>`).join('');

    html += `
      <div class="grid-main">
        <section class="panel">
          <div class="chart-head">
            <h2 class="panel-title">Severity timeline, last 30 days</h2>
            <div class="legend">${legend}</div>
          </div>
          ${renderTimeline(analytics.by_day)}
        </section>
        <section class="panel">
          <h2 class="panel-title">Severity breakdown</h2>
          <div class="share-total">${total}</div>
          <div class="share">${SEVERITIES.filter(severity => sev[severity]).map(severity => `<div class="sev-${severity}" style="flex:${sev[severity]}"></div>`).join('')}</div>
          ${SEVERITIES.map(severity => `
            <div class="sev-row sev-${severity}">
              <span class="dot"></span>${capitalize(severity)}
              <span class="num">${sev[severity] || 0}</span>
              <span class="pct">${total ? Math.round(((sev[severity] || 0) / total) * 100) : 0}%</span>
            </div>
          `).join('')}
        </section>
      </div>
    `;

    const topTags = (analytics.top_tags || []).map(row => ({ name: row.tag, count: row.count }));
    const topIocs = (analytics.top_iocs || []).map(row => ({ name: row.ioc, count: row.count }));

    html += `
      <div class="grid-lists">
        <section class="panel">
          <h2 class="panel-title">Top tags</h2>
          ${topTags.length ? renderRank(topTags) : '<p class="empty">No tags yet</p>'}
        </section>
        <section class="panel">
          <h2 class="panel-title">Top IOCs</h2>
          ${topIocs.length ? renderRank(topIocs, { mono: true }) : '<p class="empty">No IOCs extracted yet</p>'}
        </section>
      </div>
    `;

    // CVE frequency (only shown when >= 5 unique CVEs exist)
    if (analytics.cve_graph && analytics.cve_graph.length >= 5) {
      const topCves = analytics.cve_graph.slice(0, 20).map(row => ({ name: row.cve, count: row.count }));
      html += `
        <section class="panel" style="margin-bottom:16px;">
          <h2 class="panel-title">Most referenced CVEs, last 30 days</h2>
          ${renderRank(topCves, { mono: true, columns: true })}
        </section>
      `;
    }

    html += `
      <section class="panel">
        <h2 class="panel-title">Feed health</h2>
        ${renderFeedHealth(feedData.feeds || [])}
      </section>
    `;

    document.getElementById('content').innerHTML = html;
  }

  loadDashboard().catch(err => {
    document.getElementById('content').innerHTML =
      `<div class="status-msg is-error">Could not load analytics: ${esc(err.message)}</div>`;
  });
</script>
{% endblock %}
