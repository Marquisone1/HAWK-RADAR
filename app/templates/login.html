<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — HAWK RADAR</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
  <script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light'); } catch (e) {}</script>
</head>
<body>
  <div class="login">
    <main class="login-form">
      <div class="brand">
        <svg class="brand-mark" aria-hidden="true"><use href="{{ url_for('static', filename='icons.svg') }}#logo"></use></svg>
        <span>HAWK RADAR</span>
      </div>
      <h1>Sign in</h1>
      <p class="page-sub">Threat reports and advisories for incident response</p>

      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}
      {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}

      <form method="POST" action="/login" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Sign in</button>
      </form>
    </main>

    <div class="login-scope" aria-hidden="true">
      <svg class="scope" viewBox="0 0 640 640">
        <defs>
          <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="320" y1="72" x2="510" y2="150">
            <stop offset="0" style="stop-color:var(--accent);stop-opacity:0" />
            <stop offset="1" style="stop-color:var(--accent);stop-opacity:0.18" />
          </linearGradient>
        </defs>
        <line class="axis" x1="320" y1="32" x2="320" y2="608" />
        <line class="axis" x1="32" y1="320" x2="608" y2="320" />
        <line class="axis" x1="116" y1="116" x2="524" y2="524" />
        <line class="axis" x1="524" y1="116" x2="116" y2="524" />
        <circle class="ring" cx="320" cy="320" r="72" />
        <circle class="ring" cx="320" cy="320" r="144" />
        <circle class="ring" cx="320" cy="320" r="216" />
        <circle class="ring" cx="320" cy="320" r="288" />
        <path fill="url(#sweep)" d="M320 320 L320 32 A288 288 0 0 1 523.6 116.4 Z" />
        <line class="arm" x1="320" y1="320" x2="523.6" y2="116.4" />
        <g class="tick">
          <line x1="320" y1="32" x2="320" y2="44" />
          <line x1="608" y1="320" x2="596" y2="320" />
          <line x1="320" y1="608" x2="320" y2="596" />
          <line x1="32" y1="320" x2="44" y2="320" />
        </g>
        <text x="320" y="22">000</text>
        <text x="626" y="324">090</text>
        <text x="320" y="630">180</text>
        <text x="14" y="324">270</text>
        <circle class="contact sev-critical" cx="478" cy="176" r="5" />
        <circle class="contact sev-high" cx="430" cy="252" r="4" />
        <circle class="contact sev-high" cx="196" cy="168" r="4" />
        <circle class="contact sev-medium" cx="520" cy="392" r="3" />
        <circle class="contact sev-medium" cx="256" cy="452" r="3" />
        <circle class="contact sev-medium" cx="132" cy="352" r="3" />
        <circle class="contact sev-low" cx="376" cy="520" r="3" />
        <circle class="contact sev-low" cx="212" cy="276" r="3" />
        <circle class="contact sev-low" cx="404" cy="388" r="3" />
        <path d="M296 334 L320 310 L336 318 L322 324 L330 338 L318 332 L306 342 Z" fill="var(--text)" />
      </svg>
    </div>
  </div>
</body>
</html>
